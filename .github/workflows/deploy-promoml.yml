name: Publicar encurtador PromoML na Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'src/promoml-shortener.js'
      - 'src/affiliate-stores.js'
      - 'wrangler.promoml.toml'
      - '.github/workflows/deploy-promoml.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-promoml-encurtador
  cancel-in-progress: false

jobs:
  publicar-encurtador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar links e segurança sem publicar
        run: npm test
      - name: Validar empacotamento do encurtador sem publicar
        run: npx wrangler deploy --config wrangler.promoml.toml --dry-run --outdir=dist-promoml
      - name: Verificar autorização de publicação existente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::PromoML não publicado: token e/ou conta Cloudflare ausentes."
            exit 1
          fi
      - name: Publicar Worker isolado no domínio promoml.app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.promoml.toml
