name: Testar CR Jornada Afiliados
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Executar testes sem enviar mensagens reais
        run: npm test
