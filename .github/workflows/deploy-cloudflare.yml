name: Publicar CR Jornada Afiliados na Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-cr-jornada-afiliados
  cancel-in-progress: false

jobs:
  testar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar publicações e imagens sem mandar mensagens reais
        run: npm test
      - name: Validar Cloudflare sem publicar
        run: npx wrangler deploy --dry-run --outdir=dist
      - name: Conferir se a implantação está autorizada
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare não foi publicada: faltam CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID nos Secrets do repositório."
            exit 1
          fi
      - name: Publicar Worker e Cron na conta Cloudflare autorizada
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
