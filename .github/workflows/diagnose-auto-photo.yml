name: Diagnose automatic photo queue (read-only)
on:
  push:
    branches: ['fix/diagnose-auto-photo-20261116']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Read-only Cloudflare production D1 status diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo 'Schema:'
          npx wrangler d1 execute cr-jornada-afiliados-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('offers','logs','telegram_photo_retries','affiliate_product_images','affiliate_verified_sources','affiliate_image_browser_budget','affiliate_scheduled_showcase_budget')"
          echo 'Recent queue status (no product links/titles):'
          npx wrangler d1 execute cr-jornada-afiliados-db --remote --command "SELECT id,status,CASE WHEN last_error LIKE 'Aguardando foto%' THEN 'photo_missing' WHEN last_error IS NULL THEN 'none' ELSE substr(last_error,1,50) END AS reason,created_at,published_at FROM offers ORDER BY id DESC LIMIT 12"
          echo 'Photo retry counters:'
          npx wrangler d1 execute cr-jornada-afiliados-db --remote --command "SELECT offer_id,attempts,next_retry_at,updated_at FROM telegram_photo_retries ORDER BY updated_at DESC LIMIT 12"
          echo 'Recent publication event types (no links):'
          npx wrangler d1 execute cr-jornada-afiliados-db --remote --command "SELECT offer_id,event,created_at FROM logs ORDER BY id DESC LIMIT 16"
          echo 'Image browser budget:'
          npx wrangler d1 execute cr-jornada-afiliados-db --remote --command "SELECT day_key,daily_count,last_at FROM affiliate_image_browser_budget WHERE id=1" || true
