name: Diagnose automatic photo queue (read-only)
on:
  push:
    branches: ['fix/diagnose-auto-photo-20261116']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Query recent queue states and photo lookup budget (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute cr-jornada-afiliados-db --remote --json --command "SELECT o.id AS offer_id,o.status,substr(coalesce(o.last_error,''),1,180) AS last_error, o.created_at, o.published_at, coalesce(r.attempts,0) AS photo_attempts,coalesce(r.next_retry_at,0) AS next_retry,CASE WHEN i.affiliate_url IS NULL THEN 0 ELSE 1 END AS cached_image,CASE WHEN s.affiliate_url IS NULL THEN 0 ELSE 1 END AS known_source FROM offers o LEFT JOIN telegram_photo_retries r ON r.offer_id=o.id LEFT JOIN affiliate_product_images i ON i.affiliate_url=o.affiliate_url LEFT JOIN affiliate_verified_sources s ON s.affiliate_url=o.affiliate_url ORDER BY o.id DESC LIMIT 14" > /tmp/queue.json
          npx wrangler d1 execute cr-jornada-afiliados-db --remote --json --command "SELECT event,created_at,offer_id FROM logs ORDER BY id DESC LIMIT 28" > /tmp/events.json
          npx wrangler d1 execute cr-jornada-afiliados-db --remote --json --command "SELECT day_key,daily_count,last_at FROM affiliate_image_browser_budget WHERE id=1" > /tmp/browser.json || echo '[]' > /tmp/browser.json
          npx wrangler d1 execute cr-jornada-afiliados-db --remote --json --command "SELECT day_key,daily_count,last_at FROM affiliate_scheduled_showcase_budget WHERE id=1" > /tmp/showcase.json || echo '[]' > /tmp/showcase.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          function load(file){
            try{const v=JSON.parse(readFileSync('/tmp/'+file+'.json','utf8'));
              return (Array.isArray(v)?v:[v]).flatMap(x=>x?.results||[]);}
            catch{return [];}
          }
          const scrub=s=>String(s||'').replace(/https?:\/\/\S+/g,'[URL]').slice(0,105);
          console.log('READ ONLY. Offer ids, queue state, retry count, photo cache flags (no product links):');
          console.log(JSON.stringify(load('queue').map(x=>({...x,last_error:scrub(x.last_error)}))));
          console.log('Recent event names + offer ids (no message content):');
          console.log(JSON.stringify(load('events')));
          console.log('Browser budgets:');
          console.log(JSON.stringify({images:load('browser'),showcase:load('showcase')}));
          NODE
